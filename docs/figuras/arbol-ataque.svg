<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430"><style>text{font-family:Arial;font-size:15px;fill:#173047}.b{fill:#eef3f7;stroke:#9bb0c2}.gold{fill:#fff0bb;stroke:#ba8800}</style><rect x="300" y="10" width="450" height="50" rx="8" class="b"/><text x="525" y="40" text-anchor="middle">Entrar a un evento sin pagar</text><path d="M525 60V90 M175 105H875 M175 105V135 M525 105V135 M875 105V135" fill="none" stroke="#607a90"/><circle cx="525" cy="105" r="20" fill="white" stroke="#607a90"/><text x="525" y="110" text-anchor="middle">O</text><rect x="10" y="140" width="330" height="50" rx="6" class="b"/><text x="175" y="170" text-anchor="middle">A. Inscripción figura pagada</text><path d="M175 190V225" stroke="#607a90"/><text x="175" y="215" text-anchor="middle">O</text><path d="M13 213V252H20" fill="none" stroke="#607a90"/><path d="M175 213H13" stroke="#607a90"/><rect x="20" y="230" width="310" height="45" rx="5" class="b"/><text x="175" y="258" text-anchor="middle">T01 · Falsificar webhook</text><path d="M13 213V312H20" fill="none" stroke="#607a90"/><path d="M175 213H13" stroke="#607a90"/><rect x="20" y="290" width="310" height="45" rx="5" class="b"/><text x="175" y="318" text-anchor="middle">T05 · Repetir o alterar webhook</text><path d="M13 213V372H20" fill="none" stroke="#607a90"/><path d="M175 213H13" stroke="#607a90"/><rect x="20" y="350" width="310" height="45" rx="5" class="gold"/><text x="175" y="378" text-anchor="middle">T07 · Alterar precio a 0 ★</text><rect x="360" y="140" width="330" height="50" rx="6" class="b"/><text x="525" y="170" text-anchor="middle">B. QR válido sin pago propio</text><path d="M525 190V225" stroke="#607a90"/><text x="525" y="215" text-anchor="middle">O</text><path d="M363 213V252H370" fill="none" stroke="#607a90"/><path d="M525 213H363" stroke="#607a90"/><rect x="370" y="230" width="310" height="45" rx="5" class="b"/><text x="525" y="258" text-anchor="middle">T03 · Fabricar QR predecible</text><path d="M363 213V312H370" fill="none" stroke="#607a90"/><path d="M525 213H363" stroke="#607a90"/><rect x="370" y="290" width="310" height="45" rx="5" class="b"/><text x="525" y="318" text-anchor="middle">Y: obtener QR ajeno (T14)</text><path d="M363 213V372H370" fill="none" stroke="#607a90"/><path d="M525 213H363" stroke="#607a90"/><rect x="370" y="350" width="310" height="45" rx="5" class="b"/><text x="525" y="378" text-anchor="middle">y usarlo antes o a la vez (T06)</text><rect x="710" y="140" width="330" height="50" rx="6" class="b"/><text x="875" y="170" text-anchor="middle">C. Abusar de funciones privilegiadas</text><path d="M875 190V225" stroke="#607a90"/><text x="875" y="215" text-anchor="middle">Y</text><path d="M713 213V252H720" fill="none" stroke="#607a90"/><path d="M875 213H713" stroke="#607a90"/><rect x="720" y="230" width="310" height="45" rx="5" class="b"/><text x="875" y="258" text-anchor="middle">O: obtener rol (T23 / T24 / T04)</text><path d="M713 213V312H720" fill="none" stroke="#607a90"/><path d="M875 213H713" stroke="#607a90"/><rect x="720" y="290" width="310" height="45" rx="5" class="b"/><text x="875" y="318" text-anchor="middle">Acceder a operación de pago</text><path d="M713 213V372H720" fill="none" stroke="#607a90"/><path d="M875 213H713" stroke="#607a90"/><rect x="720" y="350" width="310" height="45" rx="5" class="b"/><text x="875" y="378" text-anchor="middle">sin autorización efectiva (T21)</text></svg>